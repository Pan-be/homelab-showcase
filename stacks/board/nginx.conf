server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Only Homepage may frame the board.
    add_header Content-Security-Policy "frame-ancestors 'self' https://home.example.com http://home.arpa http://192.0.2.50:3000" always;
    add_header Cache-Control "no-cache" always;
    location = /healthz { return 200 "ok\n"; }
    location / { try_files $uri $uri/ =404; }
}
