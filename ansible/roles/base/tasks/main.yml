---
- name: Base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Read the timezone
  ansible.builtin.command: timedatectl show -p Timezone --value
  register: base_tz
  changed_when: false
  check_mode: false

- name: Set the timezone
  ansible.builtin.command: timedatectl set-timezone {{ timezone }}
  when: base_tz.stdout != timezone
  changed_when: true

- name: Static LAN address (netplan)
  ansible.builtin.copy:
    src: "{{ host_files }}/etc/netplan/50-cloud-init.yaml"
    dest: /etc/netplan/50-cloud-init.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Apply netplan
  when: not restore_test

# Key-only SSH. sshd takes the first value it reads and reads drop-ins in name order, so 00-
# wins; cloud-init's 50-cloud-init.conf (PasswordAuthentication yes) is removed anyway.
- name: SSH server settings
  ansible.builtin.copy:
    src: "{{ host_files }}/etc/ssh/sshd_config.d/00-serverus.conf"
    dest: /etc/ssh/sshd_config.d/00-serverus.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sshd

- name: No cloud-init password login drop-in
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf
    state: absent
  notify: Reload sshd

# Pi-hole binds port 53 on all addresses, so resolved's stub listener on 127.0.0.53:53 is off.
- name: DNS resolver without its stub listener (systemd-resolved)
  ansible.builtin.copy:
    src: "{{ host_files }}/etc/systemd/resolved.conf"
    dest: /etc/systemd/resolved.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart resolved

- name: Base services enabled and running
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ base_services }}"

- name: Hardware services enabled (running only on real hardware)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: "{{ omit if ansible_virtualization_role == 'guest' else 'started' }}"
  loop: "{{ base_hw_services }}"
