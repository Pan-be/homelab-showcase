---
- name: Keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Docker apt key
  ansible.builtin.shell: >-
    set -o pipefail &&
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/docker.gpg

- name: Docker apt repository
  ansible.builtin.copy:
    src: "{{ host_files }}/etc/apt/sources.list.d/docker.list"
    dest: /etc/apt/sources.list.d/docker.list
    owner: root
    group: root
    mode: "0644"
  register: docker_repo

- name: Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: "{{ docker_repo is changed }}"

- name: Docker drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Docker daemon config and the wait-for-mounts drop-in
  ansible.builtin.copy:
    src: "{{ host_files }}/{{ item }}"
    dest: "/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - etc/docker/daemon.json
    - etc/systemd/system/docker.service.d/nvme.conf
  notify: Restart docker

- name: Admin user in the docker group
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: docker
    append: true

- name: Docker enabled and running
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Check external networks
  ansible.builtin.command: docker network inspect {{ item }}
  loop: "{{ docker_external_networks }}"
  register: docker_nets
  failed_when: false
  changed_when: false
  check_mode: false

- name: Create missing external networks
  ansible.builtin.command: docker network create {{ item.item }}
  loop: "{{ docker_nets.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  changed_when: true
