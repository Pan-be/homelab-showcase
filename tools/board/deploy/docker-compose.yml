# /opt/board: static, read-only board pages, served to Caddy only (no published port).
services:
  board:
    image: nginx:1.30.6-alpine
    container_name: board
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true
